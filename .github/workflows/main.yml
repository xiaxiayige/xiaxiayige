name: Hi

on:
  schedule:
    # UTC 00:00，即北京时间每天 08:00
    - cron: '0 0 * * *'
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# 避免同一分支的多个任务同时更新 README
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 如果项目有 requirements.txt，取消下面的注释
      # - name: Install dependencies
      #   run: python -m pip install -r requirements.txt

      - name: Update README
        run: python main.py

      - name: Commit and push if changed
        # PR 只运行脚本检查，不提交、不推送
        if: github.event_name != 'pull_request'
        run: |
          git config user.email "xiaxiayige@163.com"
          git config user.name "xiaxiayige"

          git add -- README.md

          if git diff --cached --quiet; then
            echo "README.md 没有变化，跳过提交"
            exit 0
          fi

          git commit -m "docs: 自动更新 README"
          git push
